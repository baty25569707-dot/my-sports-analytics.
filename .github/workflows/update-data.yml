name: Multi-Sport Data Auto Analyzer

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update-sports-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Multi-Sport Data
        run: |
          python -c "
          import json, datetime

          now_str = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')

          data = {
              'updated_at': now_str,
              'categories': {
                  'soccer': {
                      'name': '足球',
                      'leagues': ['歐冠', '英超', '西甲', '國家隊'],
                      'matches': [
                          {
                              'league': '國家隊',
                              'time': '20:00',
                              'homeTeam': '捷克',
                              'awayTeam': '英格蘭',
                              'info': '歐國聯焦點戰 | 捷克主場攻勢兇猛 VS 英格蘭豪華鋒線',
                              'h2h': '近 4 次交手 英格蘭 2 勝 1 和 1 敗 (平均總進球 3.2 顆)',
                              'aiTrend': '主推：全場 2.5 大分 | 英格蘭讓分 (-1.0)',
                              'confidence': 88,
                              'detail': {
                                  'homeRecord': '主場 4勝 1敗 (近5場大分率 100%)',
                                  'awayRecord': '客場 3勝 2敗 (平均場均進球 2.2)',
                                  'venue': '伊甸園體育場 (Eden Aréna)',
                                  'weather': '多雲陣雨',
                                  'weatherIcon': 'fa-cloud-rain',
                                  'temp': '16°C',
                                  'wind': '陣風 11 km/h',
                                  'tacticalAnalysis': '英格蘭前場火力旺盛，近 5 場賽事平均創造 2.8 次絕佳進攻機會。然而客場作戰時兩翼壓上易留邊路空檔；捷克主場風格極具侵略性，近 5 場全數打出 2.5 球以上大分。',
                                  'oddsMovement': '初盤開出英格蘭讓 1.0/1.5 球，後續資金流入讓分水位維持在 1.85 低水；大分 2.5 球水位由 1.95 調降至 1.80，大分較受市場資金青睞。',
                                  'injuries': '英格蘭中場進行小幅輪換，鋒線主力全數登場；捷克防線主力中衛因累積黃牌停賽，後防抗壓性大打折扣。',
                                  'bettingOptions': [
                                      {'type': '讓分盤', 'selection': '英格蘭 -1.0', 'odds': '1.85', 'units': 1.5},
                                      {'type': '大小分', 'selection': '全場 2.5 大分', 'odds': '1.80', 'units': 1.5},
                                      {'type': '角球盤', 'selection': '全場角球 9.5 大', 'odds': '1.85', 'units': 0.5},
                                      {'type': '串關組合', 'selection': '2.5大 + 巴西獨贏 (2關1)', 'odds': '2.61', 'units': 0.5}
                                  ],
                                  'aiReason': '結合兩隊近期高大分率與捷克防線停賽隱憂，單場大分與讓分盤極具投資價值；角球與串關採輕注配置以博取高賠率回報。'
                              }
                          }
                      ]
                  },
                  'baseball': {
                      'name': '棒球',
                      'leagues': ['MLB', 'CPBL', 'NPB'],
                      'matches': [
                          {
                              'league': 'MLB',
                              'time': '07:10',
                              'homeTeam': '洛杉磯道奇',
                              'awayTeam': '紐約洋基',
                              'info': '山本由伸 (11-4, 2.65) VS Gerrit Cole (13-5, 3.10)',
                              'h2h': '道奇近 10 場對戰 6 勝 4 敗',
                              'aiTrend': '主推：道奇讓分 (-1.5) | 總分 8.5 大',
                              'confidence': 86,
                              'detail': {
                                  'homeRecord': '主場 32勝 15敗',
                                  'awayRecord': '客場 23勝 22敗',
                                  'venue': '道奇體育場 (Dodger Stadium)',
                                  'weather': '晴朗乾燥',
                                  'weatherIcon': 'fa-sun',
                                  'temp': '23°C',
                                  'wind': '微風 8 km/h (吹向外野)',
                                  'tacticalAnalysis': '山本由伸近 3 場先發防禦率僅 1.80，主場宰制力極強；洋基近期牛棚負擔過重，近 3 場後援防禦率上升至 4.95。',
                                  'oddsMovement': '道奇獨贏水位從 1.70 降至 1.62，市場資金持續看好道奇主場取勝。',
                                  'injuries': '道奇主力打線齊全；洋基牛棚兩名主力投手因傷缺陣。',
                                  'bettingOptions': [
                                      {'type': '讓分盤', 'selection': '道奇 -1.5', 'odds': '1.90', 'units': 1.5},
                                      {'type': '大小分', 'selection': '全場 8.5 大分', 'odds': '1.85', 'units': 1.0},
                                      {'type': '獨贏盤', 'selection': '道奇不讓分勝', 'odds': '1.62', 'units': 1.0},
                                      {'type': '串關組合', 'selection': '道奇主勝 + 勇士獨贏', 'odds': '2.45', 'units': 0.5}
                                  ],
                                  'aiReason': '山本由伸先發穩健加上道奇主場強大打擊火力，過盤率極高。'
                              }
                          }
                      ]
                  },
                  'basketball': {
                      'name': '籃球',
                      'leagues': ['NBA', 'TPBL'],
                      'matches': [
                          {
                              'league': 'NBA',
                              'time': '08:30',
                              'homeTeam': '金州勇士',
                              'awayTeam': '洛杉磯湖人',
                              'info': 'Curry (場均28.5分) VS LeBron (場均25.2分)',
                              'h2h': '勇士近 5 次主場迎戰湖人 4 勝 1 敗',
                              'aiTrend': '主推：勇士 -3.5 | 總分 224.5 大',
                              'confidence': 85,
                              'detail': {
                                  'homeRecord': '主場 18勝 5敗',
                                  'awayRecord': '客場 9勝 13敗',
                                  'venue': '大通中心 (Chase Center)',
                                  'weather': '室內館',
                                  'weatherIcon': 'fa-building',
                                  'temp': '20°C',
                                  'wind': '無風',
                                  'tacticalAnalysis': '勇士主場三分球場均命中 16.2 記為聯盟第一；湖人 Anthony Davis 腳踝有傷，禁區防守面臨大考驗。',
                                  'oddsMovement': '讓分盤口從 -2.5 調高至 -3.5，資金向勇士傾斜。',
                                  'injuries': '湖人 Anthony Davis 出賽成疑 (50%)。',
                                  'bettingOptions': [
                                      {'type': '讓分盤', 'selection': '勇士 -3.5', 'odds': '1.90', 'units': 1.5},
                                      {'type': '大小分', 'selection': '全場 224.5 大', 'odds': '1.88', 'units': 1.0},
                                      {'type': '串關組合', 'selection': '勇士-3.5 + 歐冠2.5大', 'odds': '3.20', 'units': 0.5}
                                  ],
                                  'aiReason': '勇士主場外線火力旺盛，若湖人禁區核心帶傷受限，勇士相當有機會蓋過讓分盤。'
                              }
                          }
                      ]
                  },
                  'tennis': {
                      'name': '網球',
                      'leagues': ['ATP 大滿貫'],
                      'matches': [
                          {
                              'league': 'ATP',
                              'time': '21:00',
                              'homeTeam': 'Alcaraz C.',
                              'awayTeam': 'Sinner J.',
                              'info': '世界排名 No.2 VS No.1 頂尖決戰',
                              'h2h': '對戰生涯紀錄 Alcaraz 6 勝 4 敗',
                              'aiTrend': '主推：總局數 39.5 大分',
                              'confidence': 86,
                              'detail': {
                                  'homeRecord': '硬地戰績 32勝 6敗',
                                  'awayRecord': '硬地戰績 38勝 4敗',
                                  'venue': '中央球場 (Center Court)',
                                  'weather': '晴朗',
                                  'weatherIcon': 'fa-sun',
                                  'temp': '25°C',
                                  'wind': '6 km/h',
                                  'tacticalAnalysis': '雙方實力在伯仲之間，過去在大滿貫 3 次交手全數打滿至少 4 盤。',
                                  'oddsMovement': '獨贏盤雙方均為 1.90 平手水位。',
                                  'injuries': '雙方狀態良好無傷病。',
                                  'bettingOptions': [
                                      {'type': '大小分', 'selection': '總局數 39.5 大', 'odds': '1.85', 'units': 1.5},
                                      {'type': '讓分盤', 'selection': 'Alcaraz -1.5局', 'odds': '1.90', 'units': 1.0}
                                  ],
                                  'aiReason': '頂尖對決極有可能再次打滿盤數，大局數為最佳投注選擇。'
                              }
                          }
                      ]
                  }
              }
          }

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update detailed sports data with weather and betting options" || exit 0
          git push
