<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportX 全球智彩分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- 頂部導覽列 -->
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-chart-line text-blue-500 text-2xl"></i>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">SportX 智彩數據分析站</span>
            </div>
            <span id="update-time" class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>最後更新：載入中...</span>
        </div>
    </nav>

    <!-- 主體內容 -->
    <main class="max-w-7xl mx-auto px-4 pt-6">
        <!-- 體育項目切換頁籤 -->
        <div class="flex space-x-2 border-b border-slate-700 pb-3 mb-6 overflow-x-auto" id="category-tabs">
            <button onclick="switchCategory('baseball')" id="tab-baseball" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold bg-blue-600 text-white flex items-center gap-2">
                <i class="fa-solid fa-baseball"></i> 棒球 (MLB/CPBL/NPB/KBO)
            </button>
            <button onclick="switchCategory('basketball')" id="tab-basketball" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-basketball"></i> 籃球 (NBA/TPBL/PLG)
            </button>
            <button onclick="switchCategory('soccer')" id="tab-soccer" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-futbol"></i> 足球 (五大聯賽/歐冠)
            </button>
            <button onclick="switchCategory('tennis')" id="tab-tennis" class="tab-btn px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-baseball-bat-ball"></i> 網球 (ATP/WTA)
            </button>
        </div>

        <!-- 賽事卡片展示區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="matches-container">
            <!-- 動態渲染卡片 -->
        </div>
    </main>

    <script>
        let globalData = null;

        async function loadData() {
            try {
                const res = await fetch('./data.json?t=' + new Date().getTime());
                globalData = await res.json();
                
                document.getElementById('update-time').innerHTML = `<i class="fa-regular fa-clock mr-1"></i>最後更新：${globalData.updated_at}`;
                renderCategory('baseball');
            } catch (err) {
                console.error("無法載入賽事資料:", err);
            }
        }

        function switchCategory(catKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-2";
            });
            
            const activeBtn = document.getElementById(`tab-${catKey}`);
            if(activeBtn) {
                activeBtn.className = "tab-btn px-4 py-2 rounded-xl text-sm font-bold bg-blue-600 text-white flex items-center gap-2";
            }

            renderCategory(catKey);
        }

        function renderCategory(catKey) {
            if (!globalData || !globalData.categories || !globalData.categories[catKey]) {
                document.getElementById('matches-container').innerHTML = `<div class="col-span-full text-center text-slate-500 py-12">資料載入中，請稍後...</div>`;
                return;
            }

            const category = globalData.categories[catKey];
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            if (!category.matches || category.matches.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-500 py-12">今日暫無 ${category.name} 賽事分析數據</div>`;
                return;
            }

            category.matches.forEach(m => {
                const card = `
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 hover:border-blue-500 transition shadow-lg">
                        <div class="flex justify-between items-center mb-3 text-xs text-slate-400">
                            <span class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 font-bold border border-blue-500/20">${m.league}</span>
                            <span class="font-mono">${m.time}</span>
                        </div>
                        <div class="flex justify-between items-center my-4 text-base font-bold">
                            <div class="w-2/5 text-left">${m.homeTeam}</div>
                            <div class="text-xs text-amber-400 bg-amber-500/10 px-2 py-1 rounded-md font-mono">VS</div>
                            <div class="w-2/5 text-right">${m.awayTeam}</div>
                        </div>
                        <div class="text-xs text-slate-300 bg-slate-900/60 p-2.5 rounded-lg mb-3 leading-relaxed">
                            📌 ${m.info}<br>
                            📊 ${m.h2h}
                        </div>
                        <div class="border-t border-slate-700/80 pt-3 flex justify-between items-center text-xs">
                            <span class="text-emerald-400 font-bold">🎯 ${m.aiTrend}</span>
                            <span class="text-slate-400 bg-slate-700 px-2 py-0.5 rounded">信心度 ${m.confidence}%</span>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
