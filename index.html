<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportX 頂級量化博弈與賽事日報</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #030712; color: #f3f4f6; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .glass-header { background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(56, 189, 248, 0.15); }
        .glass-card { background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(10, 15, 30, 0.95) 100%); border: 1px solid rgba(56, 189, 248, 0.12); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card:hover { transform: translateY(-4px); border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 12px 40px -10px rgba(56, 189, 248, 0.2); }
        .modal-backdrop { background-color: rgba(3, 7, 18, 0.85); backdrop-filter: blur(10px); }
        .tab-btn { transition: all 0.25s ease; }
        .tab-btn.active { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-sky-500 selection:text-white">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 py-3.5 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center shadow-lg shadow-sky-500/30">
                    <i class="fa-solid fa-chart-line text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-wide bg-gradient-to-r from-white via-sky-200 to-sky-400 bg-clip-text text-transparent">
                        SportX 賽事量化日報中心
                    </h1>
                    <div id="daily-date" class="text-[11px] text-sky-400/80 font-mono mt-0.5"><i class="fa-regular fa-calendar-days mr-1"></i>2026-09-30 專欄</div>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2.5 text-xs">
                <div class="bg-slate-900/90 border border-sky-500/30 px-3 py-1.5 rounded-xl flex items-center gap-2 shadow-inner">
                    <span class="text-slate-400 font-medium"><i class="fa-solid fa-wallet text-amber-400 mr-1"></i>總本金:</span>
                    <span class="text-sky-400 font-bold">NT$</span>
                    <input type="number" id="user-bankroll" value="10000" step="1000" onchange="updateBankroll()" class="w-20 bg-slate-950 text-sky-300 font-bold font-mono px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-sky-400 text-center text-xs">
                    <span class="text-slate-400 text-[10px] hidden sm:inline">(Unit: <span id="unit-val" class="text-amber-400 font-bold">NT$ 300</span>)</span>
                </div>

                <div class="bg-sky-950/40 border border-sky-500/30 text-sky-300 px-3 py-1.5 rounded-xl flex items-center gap-2 font-mono">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
                    </span>
                    <span class="text-slate-400 text-[11px]">同步:</span> <span id="countdown" class="font-bold text-white">05:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        <div class="glass-card rounded-2xl p-5 md:p-6 border border-sky-500/20 bg-gradient-to-r from-slate-900 via-sky-950/30 to-slate-900 flex justify-between items-center">
            <div class="space-y-1">
                <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold">EXPERT BRIEFING</span>
                <h2 class="text-lg font-bold text-white">今日全球頂級賽事深度量化解析與複盤專欄</h2>
                <p class="text-xs text-slate-300">主頁即時顯示比賽完賽比分與實際下注派彩結果。</p>
            </div>
            <div id="header-update-time" class="text-xs text-slate-400 font-mono">最後同步：--</div>
        </div>

        <div class="flex border-b border-slate-800 overflow-x-auto gap-2 pb-2" id="tab-container"></div>

        <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="col-span-full text-center py-20 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-sky-400"></i>
                <p class="text-xs font-mono">載入中...</p>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="detail-modal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 relative border border-sky-500/30">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg w-8 h-8 rounded-full bg-slate-900 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-body" class="space-y-4"></div>
        </div>
    </div>

    <script>
        let sportsData = null;
        let currentCategory = 'soccer';
        let userBankroll = 10000;

        function updateBankroll() {
            const val = parseFloat(document.getElementById('user-bankroll').value);
            if (!isNaN(val) && val > 0) {
                userBankroll = val;
                document.getElementById('unit-val').innerText = `NT$ ${Math.round(userBankroll * 0.03)}`;
                if (sportsData) renderMatches(currentCategory);
            }
        }

        async function init() {
            updateBankroll();
            await fetchMatchesData();
        }

        async function fetchMatchesData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network response was not ok');
                sportsData = await response.json();
                document.getElementById('header-update-time').innerText = `最後同步：${sportsData.updated_at || '剛剛'}`;
                renderTabs();
                renderMatches(currentCategory);
            } catch (err) {
                console.error(err);
                document.getElementById('matches-grid').innerHTML = `
                    <div class="col-span-full text-center py-20 text-red-400 text-xs font-mono">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>無法讀取 data.json，請確認檔案已成功推送到儲存庫。</p>
                    </div>`;
            }
        }

        function renderTabs() {
            const tabContainer = document.getElementById('tab-container');
            if (!sportsData || !sportsData.categories) return;
            const categories = sportsData.categories;
            const iconMap = { baseball: 'fa-baseball', basketball: 'fa-basketball', soccer: 'fa-futbol', tennis: 'fa-table-tennis-paddle-ball' };

            tabContainer.innerHTML = Object.keys(categories).map(catKey => {
                const cat = categories[catKey];
                const icon = iconMap[catKey] || 'fa-trophy';
                const isActive = catKey === currentCategory ? 'active bg-sky-600 text-white' : 'bg-slate-900/60 text-slate-400';
                return `
                    <button onclick="switchCategory('${catKey}')" class="tab-btn ${isActive} px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 border border-slate-800">
                        <i class="fa-solid ${icon}"></i>
                        ${cat.name}
                    </button>`;
            }).join('');
        }

        function switchCategory(catKey) {
            currentCategory = catKey;
            renderTabs();
            renderMatches(catKey);
        }

        function renderMatches(catKey) {
            const matchesGrid = document.getElementById('matches-grid');
            if (!sportsData || !sportsData.categories[catKey]) {
                matchesGrid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-xs">無賽事資料</div>`;
                return;
            }
            const category = sportsData.categories[catKey];

            matchesGrid.innerHTML = category.matches.map((m, idx) => {
                const betRes = m.betResult || { selection: m.aiTrend, outcome: 'PENDING', profit: '結算中' };
                let badgeColor = betRes.outcome === 'WIN' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-sky-500/10 text-sky-300 border-sky-500/30';

                return `
                <div onclick="openModal('${catKey}', ${idx})" class="glass-card rounded-2xl p-5 cursor-pointer relative flex flex-col justify-between group">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="bg-sky-500/10 text-sky-400 text-[11px] px-2.5 py-1 rounded-md font-mono font-bold border border-sky-500/20">${m.league}</span>
                            <span class="text-xs text-slate-400 font-mono"><i class="fa-regular fa-clock mr-1"></i>${m.time} | ${m.matchStatus || '已完賽'}</span>
                        </div>

                        <div class="grid grid-cols-7 items-center my-3 text-center">
                            <div class="col-span-3">
                                <div class="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-mono">主隊</div>
                                <div class="font-bold text-base text-slate-100">${m.homeTeam}</div>
                            </div>
                            <div class="col-span-1 font-bold text-xs text-sky-400 bg-sky-950/60 rounded-full py-1 border border-sky-800/50">VS</div>
                            <div class="col-span-3">
                                <div class="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-mono">客隊</div>
                                <div class="font-bold text-base text-slate-100">${m.awayTeam}</div>
                            </div>
                        </div>

                        <div class="bg-slate-950/90 border border-slate-800 rounded-xl p-3 text-xs flex justify-between items-center font-mono my-3 shadow-inner">
                            <div>
                                <span class="text-slate-400 text-[10px] block">最終比分</span>
                                <span class="font-bold text-white text-sm">${m.finalScore || '結算中'}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-slate-400 text-[10px] block">派彩結算</span>
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold border ${badgeColor}">${betRes.profit}</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-slate-800 text-xs">
                        <div class="text-sky-300 font-semibold font-mono">主推：${betRes.selection}</div>
                        <div class="bg-sky-500/10 text-sky-300 px-2 py-0.5 rounded font-mono text-[11px]">信心 ${m.confidence}%</div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function openModal(catKey, matchIndex) {
            const m = sportsData.categories[catKey].matches[matchIndex];
            const d = m.detail || {};
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <h2 class="text-lg font-bold text-white">${m.league}: ${m.homeTeam} vs ${m.awayTeam}</h2>
                <div class="text-xs text-emerald-400 font-mono">狀態：${m.matchStatus} | 比分：${m.finalScore}</div>
                <div class="bg-slate-900 p-3 rounded-xl text-xs space-y-2 text-slate-300">
                    <p><strong>場地：</strong> ${d.venue} (${d.weather})</p>
                    <p><strong>戰術分析：</strong> ${d.tacticalAnalysis}</p>
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        init();
    </script>
</body>
</html>
